<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Syed Suhail & Taskeen Fathima | Valima Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#fffaf2;

color:#3b3025;

font-family:'Cormorant Garamond',serif;

overflow-x:hidden;

}


/* =====================
OPENING SCREEN
===================== */


#opening{

position:fixed;

inset:0;

background:
linear-gradient(
180deg,
#fffdf8,
#f3eadb
);

display:flex;

justify-content:center;

align-items:center;

z-index:9999;

overflow:hidden;

}


/* Light from heaven */

.light{

position:absolute;

width:700px;

height:700px;

background:
radial-gradient(
circle,
rgba(255,240,190,.8),
transparent 65%
);

animation:lightMove 8s infinite alternate;

}


@keyframes lightMove{

from{
transform:scale(1);
}

to{
transform:scale(1.3);
}

}



/* Envelope */


.envelope{

width:330px;

height:220px;

background:
linear-gradient(
135deg,
#fff4dc,
#d8b46a
);

border-radius:20px;

box-shadow:
0 30px 80px rgba(0,0,0,.25);

position:relative;

display:flex;

justify-content:center;

align-items:center;

transition:1.5s;

}


.envelope.open{

transform:
translateY(-200px)
scale(.4);

opacity:0;

}



.seal{

width:90px;

height:90px;

border-radius:50%;

background:#c79b45;

color:white;

display:flex;

align-items:center;

justify-content:center;

font-family:'Great Vibes';

font-size:35px;

box-shadow:
0 0 40px #e7c778;

cursor:pointer;

animation:pulse 2s infinite;

}



@keyframes pulse{

50%{
transform:scale(1.1);
}

}



.envelope-text{

position:absolute;

bottom:-90px;

text-align:center;

color:#8b6a32;

font-size:22px;

}



/* =====================
HEAVEN DOORS
===================== */


#doors{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:1s;

}


#doors.show{

opacity:1;

pointer-events:auto;

}



/* Door panels */


.door{

position:absolute;

top:0;

width:50%;

height:100%;

background:

linear-gradient(
135deg,
#fffdf8,
#e9d5ad
);

border:3px solid #c79b45;

transition:2s cubic-bezier(.7,-.5,.2,1.5);

}



.left{

left:0;

transform-origin:left;

}


.right{

right:0;

transform-origin:right;

}


.open-left{

transform:
perspective(1200px)
rotateY(-110deg);

}


.open-right{

transform:
perspective(1200px)
rotateY(110deg);

}



/* Door content */


.door-content{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

text-align:center;

z-index:5;

}


.door-content h2{

font-family:'Cinzel';

letter-spacing:4px;

color:#9b7635;

}


.door-content h1{

font-family:'Great Vibes';

font-size:80px;

color:#c79b45;

margin:20px;

}



.door-content p{

font-size:24px;

}



button{

margin-top:30px;

padding:15px 45px;

border-radius:50px;

border:none;

background:#c79b45;

color:white;

font-size:16px;

letter-spacing:3px;

cursor:pointer;

}



/* =====================
MAIN INVITATION
===================== */


#main{

display:none;

text-align:center;

}


.hero{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

background:

radial-gradient(
circle,
#fff,
#fff7e8
);

}



.arabic{

font-size:35px;

color:#c79b45;

}



.hero h1{

font-family:'Great Vibes';

font-size:90px;

color:#b88732;

}



.and{

font-size:60px;

color:#c79b45;

}

<section class="section">

<h2>Valima Reception</h2>

<div class="card">

<h3>Sunday</h3>

<h1>
05 September 2026
</h1>

<p>
8:00 PM Onwards
</p>

</div>

</section>


<section class="section">

<h2>Counting Down</h2>


<div class="countdown">

<div>
<span id="days">00</span>
Days
</div>

<div>
<span id="hours">00</span>
Hours
</div>

<div>
<span id="minutes">00</span>
Minutes
</div>

<div>
<span id="seconds">00</span>
Seconds
</div>

</div>


</section>


<section class="section">

<h2>Venue</h2>


<div class="card">

<h3>
Classic Banquet Hall
</h3>


<p>
No.831, 4th Block<br>
HBR Layout<br>
Bangalore 560043
</p>


<a href="https://www.google.com/maps/search/?api=1&query=Classic+Banquet+Hall+HBR+Layout+Bangalore"
target="_blank">

<button>
📍 Open Google Maps
</button>

</a>


</div>


</section>



<section class="section">


<p class="quote">

"Your Presence Will Be Our Greatest Blessing"

</p>


<h2>
With Love
</h2>


<h1 class="names">

Syed's Family

</h1>


<p>
JazakAllahu Khair
</p>


</section>



</main>




<!-- MUSIC -->

<audio id="music" loop>

<source src="violin.mp3" type="audio/mpeg">

</audio>



<button id="musicBtn">

🎻

</button>



<script>


/* =========================
OPENING ANIMATION
========================= */


const seal =
document.querySelector(".seal");


const envelope =
document.querySelector(".envelope");


const doors =
document.querySelector("#doors");


const leftDoor =
document.querySelector(".left");


const rightDoor =
document.querySelector(".right");


const main =
document.querySelector("#main");



seal.onclick=function(){


envelope.classList.add("open");


setTimeout(()=>{


doors.classList.add("show");


},1200);


};



document.querySelector("#openInvitation")
.onclick=function(){


leftDoor.classList.add("open-left");

rightDoor.classList.add("open-right");



setTimeout(()=>{


document.querySelector("#opening").style.display="none";

main.style.display="block";


let music=document.getElementById("music");

music.volume=.35;

music.play();


},1800);


};





/* =========================
COUNTDOWN
========================= */


const weddingDate =
new Date("September 5, 2026 20:00:00").getTime();



setInterval(()=>{


let now =
new Date().getTime();



let distance =
weddingDate-now;



let days =
Math.floor(distance/(1000*60*60*24));


let hours =
Math.floor(
(distance%(1000*60*60*24))
/(1000*60*60)
);



let minutes =
Math.floor(
(distance%(1000*60*60))
/(1000*60)
);



let seconds =
Math.floor(
(distance%(1000*60))
/1000
);



document.getElementById("days").innerHTML=days;

document.getElementById("hours").innerHTML=hours;

document.getElementById("minutes").innerHTML=minutes;

document.getElementById("seconds").innerHTML=seconds;



},1000);





/* =========================
MUSIC BUTTON
========================= */


let playing=false;


document.getElementById("musicBtn")
.onclick=function(){


let music=document.getElementById("music");


if(playing){

music.pause();

this.innerHTML="🎻";

playing=false;


}

else{


music.play();

this.innerHTML="🔊";

playing=true;


}


};



</script>



</body>

</html>
