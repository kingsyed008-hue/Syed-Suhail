<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Syed Suhail & Taskeen Fathima | Valima Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#fffaf2;
color:#3b3025;
font-family:'Cormorant Garamond',serif;
overflow-x:hidden;

}


/* =========================
LUXURY OPENING
========================= */

#opening{

position:fixed;
inset:0;
background:
linear-gradient(
180deg,
#fffdf8,
#efe1c7
);

display:flex;
align-items:center;
justify-content:center;

z-index:9999;
overflow:hidden;

}


.light{

position:absolute;

width:700px;
height:700px;

background:
radial-gradient(
circle,
rgba(255,240,190,.8),
transparent 65%
);

animation:lightMove 8s infinite alternate;

}


@keyframes lightMove{

from{
transform:scale(1);
}

to{
transform:scale(1.4);
}

}



/* Envelope */

.envelope{

width:340px;
height:230px;

background:
linear-gradient(
135deg,
#fff7e6,
#d4b06a
);

border-radius:20px;

box-shadow:
0 30px 90px rgba(0,0,0,.25);

display:flex;
align-items:center;
justify-content:center;

position:relative;

transition:1.5s;

}


.envelope.hide{

transform:
translateY(-300px)
scale(.3);

opacity:0;

}



.seal{

height:95px;
width:95px;

border-radius:50%;

background:#c69b45;

color:white;

display:flex;
align-items:center;
justify-content:center;

font-family:'Great Vibes';

font-size:38px;

cursor:pointer;

box-shadow:
0 0 35px rgba(198,155,69,.8);

animation:pulse 2s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.12);

}

}



.invite-text{

position:absolute;

bottom:-90px;

text-align:center;

font-size:24px;

color:#8c6b34;

}



/* =========================
HEAVEN DOORS
========================= */


#doors{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:1s;

}


#doors.active{

opacity:1;

pointer-events:auto;

}



.door{

position:absolute;

height:100%;
width:50%;

top:0;

background:

linear-gradient(
135deg,
#fffdf8,
#e5d0a0
);

border:3px solid #c69b45;

transition:2s cubic-bezier(.7,-.5,.2,1.5);

}



.left-door{

left:0;

transform-origin:left;

}



.right-door{

right:0;

transform-origin:right;

}



.left-door.open{

transform:
perspective(1200px)
rotateY(-110deg);

}



.right-door.open{

transform:
perspective(1200px)
rotateY(110deg);

}



.door-message{

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

text-align:center;

z-index:5;

}


.door-message h2{

font-family:'Cinzel';

color:#a67c2d;

letter-spacing:3px;

}


.door-message h1{

font-family:'Great Vibes';

font-size:85px;

color:#c69b45;

margin:20px;

}


.door-message p{

font-size:24px;

}



.gold-button{

margin-top:30px;

padding:15px 45px;

border:none;

border-radius:50px;

background:#c69b45;

color:white;

font-size:16px;

letter-spacing:3px;

cursor:pointer;

}


/* =========================
MAIN INVITATION
========================= */


#main{

display:none;

text-align:center;

}


.hero{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:30px;

}


.arabic{

font-size:35px;

color:#c69b45;

}


.hero h1{

font-family:'Great Vibes';

font-size:90px;

color:#b88732;

}


.and{

font-size:60px;

color:#c69b45;

}


.section{

min-height:70vh;

padding:50px 20px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

}


.section h2{

font-family:'Cinzel';

font-size:45px;

color:#b88732;

margin-bottom:25px;

}


.card{

background:rgba(255,255,255,.6);

padding:35px;

border-radius:25px;

box-shadow:
0 20px 60px rgba(0,0,0,.1);

font-size:25px;

}
<!-- MAIN INVITATION CONTENT -->

<div id="main">


<section class="hero">

<div>

<div class="arabic">
بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ
</div>


<p style="font-size:25px;margin:20px;">
"And He has placed between you affection and mercy."
<br>
— Quran 30:21
</p>


<h1>
Syed Suhail
</h1>


<div class="and">
&
</div>


<h1>
Taskeen Fathima
</h1>


<p style="font-size:30px;color:#a67c2d;">
Valima Reception
</p>


</div>

</section>



<section class="section">

<h2>
Counting Down
</h2>


<div class="card">

<div id="countdown">

<span>
<b id="days">00</b>
<br>
Days
</span>


<span>
<b id="hours">00</b>
<br>
Hours
</span>


<span>
<b id="minutes">00</b>
<br>
Minutes
</span>


<span>
<b id="seconds">00</b>
<br>
Seconds
</span>


</div>

</div>

</section>




<section class="section">

<h2>
Valima Reception
</h2>


<div class="card">

<p>
Sunday
</p>

<h1 style="font-family:Cinzel;font-size:45px;">
05 September 2026
</h1>


<p>
8:00 PM Onwards
</p>


</div>


</section>




<section class="section">

<h2>
Venue
</h2>


<div class="card">


<h3>
Classic Banquet Hall
</h3>


<p>
No.831, 4th Block
<br>
HBR Layout
<br>
Bangalore 560043
</p>


<br>


<a href="https://www.google.com/maps/search/?api=1&query=Classic+Banquet+Hall+HBR+Layout+Bangalore"
target="_blank">

<button class="gold-button">
📍 Open Google Maps
</button>

</a>


</div>


</section>





<section class="section">


<h2>
With Love
</h2>


<div class="card">

<p>
Your Presence Will Be Our Greatest Blessing
</p>


<br>


<h1 style="font-family:'Great Vibes';color:#b88732;">
Syed's Family
</h1>


<p>
JazakAllahu Khair
</p>


</div>


</section>


</div>



<!-- MUSIC -->

<audio id="music" loop>

<source src="violin.mp3" type="audio/mpeg">

</audio>


<button id="musicButton"
style="
position:fixed;
bottom:25px;
right:25px;
width:60px;
height:60px;
border-radius:50%;
border:none;
background:#c69b45;
color:white;
font-size:25px;
z-index:9999;
">

🎻

</button>



<script>


/* OPEN ENVELOPE */


const seal =
document.querySelector(".seal");


const envelope =
document.querySelector(".envelope");


const doors =
document.querySelector("#doors");


seal.onclick=function(){


envelope.classList.add("hide");


setTimeout(()=>{

doors.classList.add("active");


},1200);


};




/* OPEN DOORS */


document.querySelector("#openInvitation")
.onclick=function(){


document.querySelector(".left-door")
.classList.add("open");


document.querySelector(".right-door")
.classList.add("open");



setTimeout(()=>{


document.querySelector("#opening")
.style.display="none";


document.querySelector("#main")
.style.display="block";


},2000);


};




/* COUNTDOWN */


const eventDate =
new Date("September 5 2026 20:00:00")
.getTime();



setInterval(()=>{


let now =
new Date().getTime();



let gap =
eventDate-now;



let d =
Math.floor(gap/(1000*60*60*24));


let h =
Math.floor(
(gap%(1000*60*60*24))
/(1000*60*60)
);


let m =
Math.floor(
(gap%(1000*60*60))
/(1000*60)
);


let s =
Math.floor(
(gap%(1000*60))
/1000
);



document.getElementById("days").innerHTML=d;

document.getElementById("hours").innerHTML=h;

document.getElementById("minutes").innerHTML=m;

document.getElementById("seconds").innerHTML=s;


},1000);

<!-- OPENING SCREEN -->

<div id="opening">

<div class="light"></div>


<div class="envelope">


<div class="seal">
S ❦ T
</div>


<div class="invite-text">

✨ Wedding Invitation ✨
<br>
Tap the golden seal

</div>


</div>



<div id="doors">


<div class="door left-door"></div>

<div class="door right-door"></div>



<div class="door-message">


<p>
بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ
</p>


<h2>
Assalamu Alaikum
</h2>


<h1>
Welcome
</h1>


<p>
You are invited to celebrate our
<br>
Valima Reception
</p>


<button 
id="openInvitation"
class="gold-button">

Open Invitation

</button>


</div>


</div>


</div>




<script>


/* MUSIC CONTROL */

let musicPlaying=false;


const music =
document.getElementById("music");


const musicButton =
document.getElementById("musicButton");



musicButton.onclick=function(){


if(musicPlaying){


music.pause();

musicButton.innerHTML="🎻";

musicPlaying=false;


}

else{


music.play();

musicButton.innerHTML="🔊";

musicPlaying=true;


}


};



/* FLOATING GOLD PARTICLES */


function createSparkle(){


const sparkle=document.createElement("div");


sparkle.style.position="fixed";

sparkle.style.width="6px";

sparkle.style.height="6px";

sparkle.style.background="#d9b45c";

sparkle.style.borderRadius="50%";

sparkle.style.left=
Math.random()*100+"vw";


sparkle.style.bottom="-20px";


sparkle.style.boxShadow=
"0 0 15px #d9b45c";


sparkle.style.animation=
"float 8s linear";


sparkle.style.zIndex="2";


document.body.appendChild(sparkle);



setTimeout(()=>{

sparkle.remove();

},8000);


}


setInterval(createSparkle,500);



</script>




<style>


#countdown{

display:flex;

gap:15px;

justify-content:center;

flex-wrap:wrap;

}


#countdown span{

background:#f6ead2;

border:1px solid #c69b45;

padding:20px;

border-radius:20px;

min-width:90px;

font-size:20px;

}



#countdown b{

font-size:35px;

color:#b88732;

}



@keyframes float{


from{

transform:translateY(0);

opacity:1;

}


to{

transform:translateY(-110vh);

opacity:0;

}


}



@media(max-width:600px){


.hero h1{

font-size:60px;

}



.door-message h1{

font-size:60px;

}


.section h2{

font-size:35px;

}


}


</style>


</body>

</html>
